version: '3'

services:
  keycloak:
    image: keycloak/keycloak:25.0
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    command: start-dev
    volumes:
      - keycloak-data:/opt/keycloak/data
    ports:
      - "8080:8080"

  oidc-sandbox:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"

volumes:
  keycloak-data:
